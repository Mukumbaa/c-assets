environment      = production     ; scelte ammesse: development, staging, production
maintenance_mode = false

[server]
bind_ip   = "0.0.0.0"
port      = 8443
max_conns = 1500
timeout   = 12.5                  # timeout in secondi (float)
tls_mode  = s                     # s: strict, m: mutual, d: disabled
prova = 123

[database]
driver    = postgres              ; scelte ammesse: postgres, mysql, sqlite
host      = 10.0.0.12
port      = 5432
username  = "service_user"
password  = "Secret#P@ss;2026"
pool_size = 20

[security]
enable_cors     = yes             ; accetta yes/no, true/false, 1/0
max_login_tries = 5
jwt_expiry_min  = 60.0

[logging]
level       = info                ; scelte ammesse: debug, info, warn, error
file_output = true
log_path    = "/var/log/app.log"
